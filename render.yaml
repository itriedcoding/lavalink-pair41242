# Render blueprint for the bot presence worker.
#
# The worker keeps a Discord gateway socket open per bot, so it must stay up.
# This runs on the free plan, and the Convex deployment pings /health every five
# minutes so Render never sees 15 minutes of inactivity. Switch the plan to
# Starter (and drop the ping) if a card is on the account.
services:
  - type: web
    name: roblox-manager-bot-worker-7f3a91
    runtime: docker
    rootDir: bot-worker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: CONVEX_SITE_URL
        value: https://quiet-cod-741.convex.site
      # Prompted once in Render; paste the value from the Convex dashboard.
      - key: WORKER_SHARED_SECRET
        sync: false
