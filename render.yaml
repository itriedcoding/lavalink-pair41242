# Render blueprint for the bot presence worker.
#
# The worker keeps a Discord gateway socket open per bot, so it must stay up:
# Render's free plan spins services down after 15 minutes and would lose the
# presence, which is why this uses the Starter plan when a card is available.
services:
  - type: web
    name: roblox-manager-music-7f3a91
    runtime: docker
    rootDir: bot-worker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: CONVEX_SITE_URL
        value: https://quiet-cod-741.convex.site
      # Prompted once in Render; paste the value from the Convex dashboard.
      - key: WORKER_SHARED_SECRET
        sync: false
